name: CI/CD Pipeline Demo

# -------------------------------------------------------------
# Trigger: When should this CI/CD pipeline run?
# -------------------------------------------------------------
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Permissions needed to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------
  # Job 1: Build & Validate (CI - Continuous Integration)
  # -----------------------------------------------------------
  test-and-lint:
    name: 🔍 Validate & Test Pages
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 🔍 Validate All HTML Pages Exist
        run: |
          for page in index.html about.html status.html; do
            if [ -f "$page" ]; then
              echo "✅ $page found successfully!"
            else
              echo "❌ Error: $page is missing!"
              exit 1
            fi
          done

      - name: 🧪 Check for 'Hello' message in index.html
        run: |
          if grep -q -i "Hello" index.html; then
            echo "✅ 'Hello' greeting found in index.html!"
          else
            echo "❌ Error: 'Hello' not found in index.html!"
            exit 1
          fi

  # -----------------------------------------------------------
  # Job 2: Deploy to GitHub Pages (CD - Continuous Deployment)
  # -----------------------------------------------------------
  deploy:
    name: 🚀 Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: ⚙️ Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 📦 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
