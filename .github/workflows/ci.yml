name: CI/CD Pipeline Demo

# -------------------------------------------------------------
# Trigger: When should this CI/CD pipeline run?
# -------------------------------------------------------------
on:
  # Trigger the pipeline on every push to the 'main' branch
  push:
    branches:
      - main
  # Trigger on pull requests targeting 'main'
  pull_request:
    branches:
      - main
  # Allows you to manually trigger the workflow from the GitHub "Actions" tab
  workflow_dispatch:

# Permissions needed to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------
  # Job 1: Build & Validate (CI - Continuous Integration)
  # -----------------------------------------------------------
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 🔍 Validate index.html exists
        run: |
          if [ -f "index.html" ]; then
            echo "✅ index.html found successfully!"
          else
            echo "❌ Error: index.html is missing!"
            exit 1
          fi

      - name: 🧪 Check for 'Hello' message in index.html
        run: |
          if grep -q -i "Hello" index.html; then
            echo "✅ 'Hello' greeting found in index.html!"
          else
            echo "❌ Error: 'Hello' not found in index.html!"
            exit 1
          fi

  # -----------------------------------------------------------
  # Job 2: Deploy to GitHub Pages (CD - Continuous Deployment)
  # -----------------------------------------------------------
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-and-lint # Runs only if the test job passes!
    if: github.ref == 'refs/heads/main' # Only deploy pushes to main
    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: ⚙️ Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the current directory where index.html is located
          path: '.'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
