name: CI/CD Pipeline Demo

# -------------------------------------------------------------
# Trigger: When should this CI/CD pipeline run?
# -------------------------------------------------------------
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------
  # CI Step: Validate and Test
  # -----------------------------------------------------------
  validate:
    name: 🔍 Validate & Test HTML
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 🔍 Check if index.html exists
        run: |
          if [ -f "index.html" ]; then
            echo "✅ index.html found successfully!"
          else
            echo "❌ Error: index.html is missing!"
            exit 1
          fi

      - name: 🧪 Verify 'Hello' Greeting
        run: |
          if grep -q -i "Hello" index.html; then
            echo "✅ Hello message found in index.html!"
          else
            echo "❌ Error: 'Hello' message not found in index.html!"
            exit 1
          fi

  # -----------------------------------------------------------
  # CD Step: Automated Deployment to GitHub Pages
  # -----------------------------------------------------------
  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: ⚙️ Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
